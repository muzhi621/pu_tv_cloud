name: ci

# 云端库只有一个运行时依赖（@edgeone/pages-blob，用于 KV 缺失时的 Blob 兜底），
# CI 做语法检查、单元测试，并验证该依赖能正常解析。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloud-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 签出代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 设置Node环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 Blob SDK 依赖
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Blob SDK 可解析
        run: node -e "import('@edgeone/pages-blob').then(m => { if (typeof m.getStore !== 'function') process.exit(1); console.log('getStore OK'); })"

      - name: Python 语法检查
        run: python -m compileall -q cloud index.py

      - name: 编辑器 JS 语法检查
        run: node --check editor/app.js

      - name: 配置 JSON 可解析性
        run: python -c "import json,pathlib; [json.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('config').glob('*.json')]"

      - name: 单元测试（Python / FC 实现）
        run: python -m unittest discover -s tests -v

      - name: EdgeOne 内联资源一致性
        run: python scripts/build_edgeone_assets.py --check

      - name: EdgeOne 函数 JS 语法检查
        run: |
          for f in $(find edge-functions -name '*.js' | sort); do
            node --check "$f"
          done

      - name: EdgeOne 接口冒烟测试
        run: node --test tests/test_edgeone.mjs
