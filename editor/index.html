<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>纯粹直播 TV · 云端配置编辑器</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">TV</span>
      <div>
        <h1>纯粹直播 TV · 云端配置</h1>
        <p>只下发配置，不承载播放流量</p>
      </div>
    </div>
    <div class="conn">
      <label>API 地址<input id="apiBase" type="text" placeholder="留空 = 同源部署"></label>
      <label>访问令牌（读）<input id="apiToken" type="password" placeholder="CONFIG_READ_TOKEN"></label>
      <label>保存令牌（写）<input id="apiWriteToken" class="narrow" type="password" placeholder="留空 = 用访问令牌"></label>
      <button id="btnConnect" class="primary">连接并加载</button>
    </div>
  </header>

  <main>
    <section class="statusbar">
      <span id="statusText" class="muted">尚未连接</span>
      <span id="bundleBadge" class="badge">套餐库 r—</span>
      <span id="devBadge" class="badge warn" hidden>开发模式：接口未鉴权</span>
      <span id="deviceStatus" class="device-status" title="终端在线 / 离线状态，自动刷新"></span>
      <span class="spacer"></span>
      <button id="btnReload" class="ghost">刷新数据</button>
    </section>

    <nav class="tabs" id="tabs">
      <button data-tab="bundles" class="active">套餐管理</button>
      <button data-tab="iptv-lib">IPTV 源</button>
      <button data-tab="vod-lib">TVBox 源</button>
      <button data-tab="devices">终端管理</button>
    </nav>

    <section id="panel" class="panel"></section>

    <section id="extra" class="extra" hidden></section>

    <section id="message" class="message" hidden></section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
