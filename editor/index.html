<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SUTV · 云端配置编辑器</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">TV</span>
      <div>
        <h1>SUTV · 云端配置</h1>
        <p>只下发配置，不承载播放流量</p>
      </div>
    </div>
    <div class="conn">
      <span id="accountBadge" class="badge" hidden></span>
      <button id="btnConnect" class="primary">刷新数据</button>
      <button id="btnChangePassword" class="ghost" hidden>修改密码</button>
      <button id="btnLogout" class="ghost" hidden>退出登录</button>
    </div>
  </header>

  <main>
    <section class="statusbar">
      <span id="statusText" class="muted">尚未连接</span>
      <span id="bundleBadge" class="badge">套餐库 r—</span>
      <span id="devBadge" class="badge warn" hidden>开发模式：接口未鉴权</span>
      <span id="deviceStatus" class="device-status" title="终端在线 / 离线状态，自动刷新"></span>
      <span class="spacer"></span>
      <button id="btnReload" class="ghost">刷新数据</button>
    </section>

    <nav class="tabs" id="tabs" role="tablist" aria-label="配置分区">
      <button data-tab="bundles" class="active" role="tab" aria-selected="true">套餐管理</button>
      <button data-tab="iptv-lib" role="tab" aria-selected="false">IPTV 源</button>
      <button data-tab="iptv-plan" role="tab" aria-selected="false">IPTV 套餐</button>
      <button data-tab="vod-lib" role="tab" aria-selected="false">TVBox 源</button>
      <button data-tab="update-lib" role="tab" aria-selected="false">在线更新</button>
      <button data-tab="devices" role="tab" aria-selected="false">终端管理</button>
    </nav>

    <section id="panel" class="panel" role="tabpanel"></section>

    <section id="extra" class="extra" hidden></section>

    <section id="message" class="message" role="status" aria-live="polite" hidden></section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!--
    登录遮罩：没登录时挡住编辑器。
    登录成功后自动带出同源 API 地址并加载全部数据，操作者不用记令牌；
    令牌入口收在 details 里，保留给「还没配账号」的部署和终端调试。
  -->
  <div id="loginMask" class="login-mask">
    <form id="loginForm" class="login-card">
      <h2>SUTV 云端登录</h2>
      <p class="meta">用管理员账号登录，登录后自动连接并加载全部配置。</p>
      <label>账号<input id="loginUser" autocomplete="username" placeholder="admin"></label>
      <label>密码<input id="loginPass" type="password" autocomplete="current-password" placeholder="至少 8 位"></label>
      <p id="loginError" class="err" hidden></p>
      <button class="primary" type="submit" id="btnLogin">登录</button>
      <details class="login-advanced">
        <summary>用令牌连接（尚未配置账号 / 终端调试）</summary>
        <label>访问令牌（读）<input id="apiToken" type="password" placeholder="CONFIG_READ_TOKEN"></label>
        <label>保存令牌（写）<input id="apiWriteToken" type="password" placeholder="留空 = 用访问令牌"></label>
        <button type="button" class="ghost" id="btnTokenConnect">用令牌连接并加载</button>
      </details>
    </form>
  </div>

  <!--
    IPTV 分组下钻：从选中的 IPTV 源里勾选频道。
    勾选状态只在「确定」时读，避免每点一次就重绘列表（会丢焦点与滚动位置）。
  -->
  <div id="planPicker" class="login-mask" hidden>
    <div id="planPickerCard" class="plan-picker-card"></div>
  </div>

  <!-- 修改密码：改完所有会话失效，需要重新登录 -->
  <div id="pwdMask" class="login-mask" hidden>
    <form id="pwdForm" class="login-card">
      <h2>修改密码</h2>
      <p class="meta">保存后本机与其他设备的登录都会失效，需要用新密码重新登录。</p>
      <label>当前密码<input id="pwdOld" type="password" autocomplete="current-password"></label>
      <label>新密码<input id="pwdNew" type="password" autocomplete="new-password" placeholder="至少 8 位"></label>
      <label>再输一次<input id="pwdNew2" type="password" autocomplete="new-password"></label>
      <p id="pwdError" class="err" hidden></p>
      <div class="toolbar">
        <button class="primary" type="submit">保存</button>
        <button class="ghost" type="button" id="btnPwdCancel">取消</button>
      </div>
    </form>
  </div>

  <script src="/app.js"></script>
</body>
</html>
